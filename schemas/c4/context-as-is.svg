@startuml





skinparam defaultTextAlignment center

skinparam wrapWidth 200
skinparam maxMessageSize 150

skinparam rectangle {
    StereotypeFontSize 12
    shadowing false
}

skinparam database {
    StereotypeFontSize 12
    shadowing false
}

skinparam Arrow {
    Color #666666
    FontColor #666666
    FontSize 12
}

skinparam rectangle<<boundary>> {
    Shadowing false
    StereotypeFontSize 0
    FontColor #444444
    BorderColor #444444
    BorderStyle dashed
}






















skinparam rectangle<<person>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #08427B
    BorderColor #073B6F
}

skinparam rectangle<<external_person>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #686868
    BorderColor #8A8A8A
}

skinparam rectangle<<system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #1168BD
    BorderColor #3C7FC0
}

skinparam rectangle<<external_system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #999999
    BorderColor #8A8A8A
}

skinparam database<<system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #1168BD
    BorderColor #3C7FC0
}

skinparam database<<external_system>> {
    StereotypeFontColor #FFFFFF
    FontColor #FFFFFF
    BackgroundColor #999999
    BorderColor #8A8A8A
}












title Контекстная диаграмма C4 — монолит «Тёплый дом» (As-Is)

rectangle "==Владелец дома\n\n Пользуется веб-интерфейсом: включает и выключает отопление, смотрит текущую температуру" <<person>> as owner
rectangle "==Сервисный инженер\n\n Выезжает на объект, регистрирует и подключает модуль отопления и датчик" <<person>> as engineer

rectangle "==Монолит «Тёплый дом»\n\n Go + PostgreSQL. Управление отоплением и мониторинг температуры в одном приложении" <<system>> as monolith

rectangle "==Модуль управления отоплением\n\n Устройство в доме, исполняет команды включения и выключения" <<external_system>> as heatingModule
rectangle "==Датчик температуры\n\n Устройство в доме, отдаёт текущее значение температуры" <<external_system>> as tempSensor

owner - -> monolith : "===Управляет отоплением, просматривает температуру\n//<size:12>[HTTPS]</size>//"
engineer - -> monolith : "===Регистрирует дом и подключает устройства\n//<size:12>[Веб-интерфейс]</size>//"
monolith - -> heatingModule : "===Отправляет команды и запрашивает состояние\n//<size:12>[HTTP, инициатор — сервер]</size>//"
monolith - -> tempSensor : "===Запрашивает текущую температуру\n//<size:12>[HTTP, инициатор — сервер]</size>//"

@enduml

